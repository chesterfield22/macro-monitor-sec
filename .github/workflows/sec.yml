name: Datos SEC (20-F) para Montos

on:
  schedule:
    - cron: '17 10 * * 1'     # lunes 10:17 UTC (07:17 en Buenos Aires)
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        run: python sec/test_bajar.py
      - name: Bajar datos de la SEC
        env:
          SEC_CONTACTO: ${{ secrets.SEC_CONTACTO }}
        run: python sec/bajar.py
      - name: Guardar cambios
        run: |
          git config user.name "macro-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Datos SEC $(date -u +%Y-%m-%d)" && git push; fi
